name: launcher
on:
  push:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["launcher/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags "-H windowsgui -s -w" -o l4d2-launcher.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2-launcher
          path: launcher/l4d2-launcher.exe
