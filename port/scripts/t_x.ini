# L4D2 PC port settings. Written by the launcher (Settings page); safe to edit.
# One name=value per line. Report of what was applied: logs\settings_applied.txt

[display]
fullscreen=false
vsync=false
resolution_scale=1
anisotropic_override=5
swap_post_effect=none

[rendering]
# Text: Source renders font glyphs on the GPU and reads them back on the CPU
# to build its glyph cache. "full" makes that readback immediate; "fast"/"some"
# return the previous frame's data, which scrambles letters.
readback_resolve=full
d3d12_readback_resolve=true
# Lighting: real occlusion queries drive Source's HDR auto-exposure.
occlusion_query_enable=true
# HDR (7e3) render targets resolved through the generic path, which converts
# the format; the direct path produced colour banding in dark/HDR scenes.
direct_host_resolve=false
# Accurate EDRAM emulation: reproduces the 360's 7e3 HDR and gamma render
# target formats exactly. Fixes dark/banded lighting from the fast (RTV) path.
# Leave empty for the faster RTV path.
render_target_path_d3d12=rov
# Dithers the final image so dark gradients don't band on 8-bit displays.
present_dither=true
# Treat bad texture fetch constants like the console does instead of dropping
# the draw (fixes black movies/cutscenes and missing surfaces).
gpu_allow_invalid_fetch_constants=true
async_shader_compilation=true
store_shaders=true

[audio]
audio_mute=false

[input]
mnk_mode=false

[overlay]
l4d2_overlay=false
l4d2_overlay_fps=true
l4d2_overlay_graph=true
l4d2_overlay_render=true
l4d2_overlay_memory=true
l4d2_overlay_settings=true
l4d2_overlay_corner=0

[debug]
log_level=info

l4d2_autoshot=2
l4d2_autoshot_limit=200
l4d2_fps_max=60
l4d2_test_autopress=false
l4d2_pc_controls=true
video_mode_width=1792
video_mode_height=504
l4d2_mod_launch_options=-novid
l4d2_console_commands=l4d2_skip_press_start 1;cl_crosshair_red 255;cl_crosshair_green 0;cl_crosshair_blue 0;cl_crosshair_thickness 4;cl_viewmodelfovsurvivor 75;mat_grain_enable 0;sb_combat_saccade_speed 2600;sb_min_attention_notice_time 0.1;sv_unlockedchapters 99;l4d2_fov 100
l4d2_test_pad=44:A|47:DOWN|49:DOWN|51:RIGHT|53:RIGHT|58:B|60:B
l4d2_test_commands=62:map c1m1_hotel
l4d2_profile=150:30
l4d2_test_input=false
